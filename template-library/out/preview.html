<title>Deck template library</title>
<style>
body { background: #05060a; }
.preview-root { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px 0; font-family: 'Inter', -apple-system, sans-serif; }
.preview-stage { position: relative; width: min(92vw, 1600px); aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.5); background: #000; }
.preview-frame { position: absolute; inset: 0; }
.preview-canvas { border: none; width: 2560px; height: 1440px; transform-origin: top left; display: block; }
.preview-controls { display: flex; align-items: center; gap: 20px; color: #cbd2e0; }
.preview-btn { background: #1a1f2b; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 999px; padding: 10px 20px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.preview-btn:hover { background: #232a38; }
.preview-count { font-size: 14px; font-variant-numeric: tabular-nums; opacity: 0.8; }
.preview-dots { display: flex; gap: 8px; }
.preview-dot { width: 8px; height: 8px; border-radius: 50%; border: none; background: rgba(255,255,255,0.25); cursor: pointer; padding: 0; }
.preview-dot.active { background: #6E8AD6; }
</style>

<script>
(function () {
  const SLIDES = ["<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap\" rel=\"stylesheet\">\n<style>/*\n  Shared visual system for brand-deck-builder slides.\n  Copy this file next to your slide .html files and <link> it — don't\n  reinvent these tokens per slide, and don't inline duplicate copies of it.\n\n  Swap the --accent-* values to re-skin the whole deck for a different\n  brand; everything else (type scale, spacing, glow technique, card system)\n  is brand-agnostic.\n*/\n\n:root {\n  /* Nexthink blue, given as the brand accent (rgb 33,69,162) */\n  --accent-900: #0F2050;\n  --accent-700: #16337D;\n  --accent-600: #2145A2; /* base */\n  --accent-500: #3E64C8;\n  --accent-400: #6E8AD6;\n  --accent-300: #9FB3E6;\n  --accent-100: #E8EDFA;\n  --accent-glow: rgba(33, 69, 162, 0.55);\n\n  /* Secondary teal -- an optional second hue for the light-blue/green/grey\n     \"glass\" palette. Pair sparingly with the primary blue (e.g. one tinted\n     glass disc in teal among otherwise blue/grey ones) -- it's a second\n     accent, not a replacement for --accent-*. */\n  --teal-700: #1F5C4E;\n  --teal-500: #3FA88F;\n  --teal-300: #8FD9C4;\n  --teal-glow: rgba(63, 168, 143, 0.5);\n\n  /* Highlighted-bar ramp: a muted yellow-green falling through green to a\n     pale base. Deliberately desaturated -- a saturated bar reads as a\n     default chart colour rather than as a lit object. */\n  --bar-lit-top:  #A9BC8F;\n  --bar-lit-mid:  #8FB6A5;\n  --bar-lit-base: #CBD2CC;\n\n  /* ORB RAMPS -- the fill for any filled circle (unit fields, ordered\n     dots). Three stops inside a NARROW range, because the job here is\n     material texture, not a light-to-dark sweep: three colours close\n     enough that no boundary between them is visible give a disc an\n     internal life that two stops cannot, while a wide ramp just makes a\n     circle look like it is fading out.\n\n     The blue deliberately does NOT use --accent-400/500. Those are the\n     brand accent's mid tones and at circle scale they read as stock\n     office blue -- the default chart fill in every deck ever made. This\n     ramp sits a step deeper and slightly less saturated, which reads as a\n     considered material rather than a swatch. */\n  --orb-blue-1: #3A5AA8;\n  --orb-blue-2: #2E4A8C;\n  --orb-blue-3: #243B72;\n  /* A sphere's lit point runs brighter than a side-lit disc's, so the\n     radial variant gets its own top stop. */\n  --orb-blue-lit:    #4A6BB8;\n  --orb-blue-shadow: rgba(28, 48, 94, 0.45);\n\n  /* The green is --bar-lit-* darkened, walking the same hues: muted\n     yellow-green, then sage, then a grey-green. It has to be a sibling of\n     the bar ramp rather than a fresh green, or the deck ends up with two\n     unrelated greens.\n\n     How much to darken it is not a taste call, it is a measurement.\n     Green is the hue the eye is most sensitive to, so a green and a blue\n     that look comparably dark in a swatch are nowhere near it on screen:\n     the bar ramp at 60% value still measured luminance 103 against this\n     blue's 73, and in the render the middle share drew the eye before the\n     primary. These values put it at 79 against 73 -- level with the blue\n     rather than under it, which is the right target. The two shares are\n     peer categories (easy against medium, say) and the ranking between\n     them is carried by their NUMBERS, not by dimming one field. Darkening\n     it further to actually sit under the blue takes it into drab olive\n     and loses the sage character the bar ramp is for.\n\n     Check this with a luminance calculation, never by eye. */\n  --orb-green-1: #515F3E;\n  --orb-green-2: #46573F;\n  --orb-green-3: #3E4E42;\n  /* Type in the green share's colour needs MORE value than the fill does.\n     Set a number in --orb-green-1 and it lands within a few points of\n     --dark-muted, so the second share and the remainder read as equally\n     dim and the three-way hierarchy collapses. Set it in --bar-lit-top and\n     it goes nearly as bright as the white primary, and the number stops\n     looking related to the field under it. This sits between the two. */\n  --orb-green-type: #849371;\n\n  --dark-bg: #0E1116;\n  --dark-bg-2: #141A24;\n  --dark-card: #1A2029;\n  --dark-border: rgba(255, 255, 255, 0.08);\n  /* Structural hairlines -- divider lists, rules under a label. Brighter\n     than --dark-border, which is for a card's edge: a card reads as an\n     object from its fill, so its border can be almost subliminal, whereas\n     a divider rule IS the only thing separating two items. */\n  --dark-rule: rgba(255, 255, 255, 0.20);\n  --dark-heading: #F4F6FA;\n  --dark-body: #98A2B3;\n  --dark-muted: #5C6478;\n\n  --light-bg: #FFFFFF;\n  --light-bg-2: #FAFAFB;\n  --light-card: #F5F6F8;\n  --light-border: rgba(15, 23, 42, 0.08);\n  --light-rule: rgba(15, 23, 42, 0.18);\n  --light-heading: #12141A;\n  --light-body: #667085;\n  --light-muted: #9AA3B2;\n\n  --radius-lg: 24px;\n  --radius-md: 16px;\n  --radius-sm: 10px;\n  --radius-pill: 999px;\n\n  --shadow-light: 0 12px 32px rgba(15, 23, 42, 0.06);\n  --shadow-dark: 0 12px 32px rgba(0, 0, 0, 0.35);\n\n  --font: 'Inter', -apple-system, 'Segoe UI', sans-serif;\n}\n\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nbody {\n  font-family: var(--font);\n  -webkit-font-smoothing: antialiased;\n}\n\n/*\n  NOTE: sizing/overflow lives on .slide itself, deliberately NOT on\n  html/body. This file gets inlined into other pages too (the\n  build_preview.mjs stitched viewer, potentially an Artifact) -- if\n  html/body were pinned to 2560x1440, they'd hijack the *host* page's\n  layout the moment this CSS loads anywhere but a standalone\n  single-slide render. .slide carries its own explicit size, which is\n  all a standalone render needs.\n*/\n.slide {\n  position: relative;\n  width: 2560px;\n  height: 1440px;\n  overflow: hidden;\n}\n\n.slide.light { background: var(--light-bg); color: var(--light-heading); }\n.slide.dark {\n  background: radial-gradient(120% 120% at 50% 0%, var(--dark-bg-2) 0%, var(--dark-bg) 60%);\n  color: var(--dark-heading);\n}\n\n/* ---------- corner framing: keep these SMALL, never a design focus ---------- */\n.frame-logo {\n  position: absolute; top: 56px; left: 64px;\n  display: flex; align-items: center; gap: 12px;\n  font-weight: 700; font-size: 28px; letter-spacing: 0.2px;\n  z-index: 5;\n}\n.frame-logo img { height: 28px; width: auto; }\n.frame-tag {\n  position: absolute; top: 56px; right: 64px;\n  font-size: 21px; letter-spacing: 0.5px; opacity: 0.55;\n  z-index: 5;\n}\n\n/* ---------- typography: the title/body size gap IS the hierarchy ---------- */\n.eyebrow {\n  font-size: 21px; font-weight: 600; letter-spacing: 1.5px;\n  text-transform: uppercase; opacity: 0.55;\n}\n/* Titles are LIGHT. A 300 weight at this size is what gives the deck its\n   calm; 800 was the original setting and it shouted on every slide. Light\n   type needs to run a little larger to hold the same presence, and it\n   wants tighter tracking, hence the negative letter-spacing that grows\n   with the size. Card titles and stats stay heavier -- they are lower in\n   the hierarchy and doing a different job. */\n.title { font-weight: 300; font-size: 90px; line-height: 1.12; letter-spacing: -1.5px; }\n.title.xl { font-size: 130px; letter-spacing: -2.5px; }\n.title.md { font-size: 66px; letter-spacing: -1px; }\n.subtitle { font-weight: 400; font-size: 28px; line-height: 1.55; max-width: 900px; }\n.subtitle.light { color: var(--light-body); }\n.subtitle.dark { color: var(--dark-body); }\n\n/*\n  LEDE -- a scale step between body (2.0%) and section title (6.3%), at\n  2.9% of slide height. For the one paragraph on a slide that carries the\n  argument itself rather than captioning something else: the prose block\n  under a title on a split layout, where it is the only text in its column\n  and has to hold that column on its own. At body size the same paragraph\n  reads as a caption that lost its picture.\n\n  Give it a SHORTER measure than the title above it (around 820px against\n  the title's 960). A paragraph and a display line want different measures,\n  and matching them is what makes a lede wrap to two lines when it wants\n  three.\n\n  ATTACH IT TO THE TITLE, never position it. Put the lede inside the same\n  block as its title and give it a margin-top of roughly 0.6 of the title's\n  line height (56px under a 90px .title, which renders as a 70px gap once\n  the descenders are accounted for). Two reasons, and the second is the one\n  that bites:\n\n    - It belongs to the title. A lede floated to its own vertical\n      coordinate stops reading as the title's paragraph and starts reading\n      as a second, unrelated element parked in the middle of the column.\n    - An absolute top is silently wrong the moment the copy changes. A\n      title that goes from three lines to two opens a hole; one that goes\n      to four puts the lede on top of its own last line. Neither shows up\n      until someone edits a word.\n*/\n.lede { font-size: 42px; font-weight: 400; line-height: 1.5; }\n.lede.light { color: var(--light-body); }\n.lede.dark { color: var(--dark-body); }\n\n/* a big focal number dwarfing its own label is a signature move here */\n.stat { font-weight: 800; font-size: 96px; line-height: 1; letter-spacing: -1px; }\n.stat.xl { font-size: 128px; }\n.stat.accent { color: var(--accent-500); }\n.stat-label { font-size: 22px; font-weight: 500; opacity: 0.65; margin-top: 12px; }\n/*\n  Mixed-color stats: the reference deck routinely colors only the\n  prefix/suffix of a stat (the \"+\" in \"+83%\", the \"x\" in \"10.8x\") while the\n  digits stay neutral -- it's a cheap, precise way to plant the accent\n  exactly on the punctuation that carries the meaning. Not a new\n  component, just wrap that one character in a span:\n  <span class=\"stat\">10.8<span class=\"stat-accent-part\">x</span></span>\n*/\n.stat-accent-part { color: var(--accent-500); }\n\n/* ---------- cards: the default content container ---------- */\n/*\n  There is ONE card treatment in this deck and it is the glass one: a\n  subtle vertical gradient running light at the bottom, and an edge where\n  the light refracts -- a conic gradient masked to a 2px band, so its\n  brightness travels round the perimeter and lands on two opposite edges\n  with dim runs between. An even 1px border and a flat fill is the single\n  thing that makes a card look like a div with a background colour.\n\n  Cards and .glass-panel are now the same material; .glass-panel differs\n  only in that it is meant for a dark slide with something rich behind it.\n  Do not reintroduce an opaque card variant -- one surface language.\n*/\n.card { position: relative; border-radius: var(--radius-lg); padding: 40px; }\n.card > * { position: relative; z-index: 1; }\n.card.dark {\n  background: linear-gradient(180deg,\n    rgba(var(--glass-tint, 200, 206, 218), 0.03),\n    rgba(var(--glass-tint, 200, 206, 218), 0.22));\n  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);\n  box-shadow: 0 24px 48px -20px rgba(0,0,0,0.55);\n}\n.card.light {\n  background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(233,237,243,0.90));\n  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);\n  box-shadow: 0 22px 46px -22px rgba(15,23,42,0.18);\n}\n/* the refracting edge. White on a dark card, ink on a light one. */\n.card::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: inherit;\n  padding: 2px; pointer-events: none;\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor;\n          mask-composite: exclude;\n}\n.card.dark::after {\n  background: conic-gradient(from 130deg,\n    rgba(255,255,255,0.80) 0deg,\n    rgba(255,255,255,0.13) 52deg,\n    rgba(255,255,255,0.58) 118deg,\n    rgba(255,255,255,0.08) 188deg,\n    rgba(255,255,255,0.72) 262deg,\n    rgba(255,255,255,0.15) 322deg,\n    rgba(255,255,255,0.80) 360deg);\n}\n.card.light::after {\n  background: conic-gradient(from 130deg,\n    rgba(15,23,42,0.20) 0deg,\n    rgba(15,23,42,0.05) 52deg,\n    rgba(15,23,42,0.14) 118deg,\n    rgba(15,23,42,0.04) 188deg,\n    rgba(15,23,42,0.17) 262deg,\n    rgba(15,23,42,0.05) 322deg,\n    rgba(15,23,42,0.20) 360deg);\n}\n.card-title { font-size: 32px; font-weight: 600; margin-bottom: 16px; }\n.card-body { font-size: 23px; line-height: 1.6; }\n.card-body.light { color: var(--light-body); }\n.card-body.dark { color: var(--dark-body); }\n/* A quiet bullet list inside a card -- gray dot, not a default disc. */\n.card-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }\n.card-list li { position: relative; padding-left: 24px; font-size: 22px; line-height: 1.5; }\n.card-list li::before {\n  content: \"\"; position: absolute; left: 0; top: 13px;\n  width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.5;\n}\n\n/* ---------- pills: status/tag chips, used sparingly ---------- */\n.pill {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 13px 26px; border-radius: var(--radius-pill);\n  font-size: 21px; font-weight: 600;\n}\n.pill.accent { background: linear-gradient(135deg, var(--accent-500), var(--accent-700)); color: #fff; }\n.pill.neutral-light { background: #fff; color: var(--light-heading); border: 1px solid var(--light-border); }\n.pill.neutral-dark { background: rgba(255, 255, 255, 0.08); color: var(--dark-heading); }\n/*\n  Pill-with-badge: a label pill carrying its own secondary value in a\n  darker inset sub-pill -- e.g. a funnel stage reading \"Leads\" with a\n  \"1000\" badge riding inside the same chip. The badge always uses a\n  translucent black overlay so it works on any pill fill color.\n  <span class=\"pill neutral-light pill-badge\">\n    <span data-overlay=\"...\">Leads</span>\n    <span class=\"pill-badge-value\" data-overlay=\"...\">1000</span>\n  </span>\n*/\n.pill-badge { padding: 8px 8px 8px 26px; }\n.pill-badge-value { background: rgba(0,0,0,0.12); border-radius: var(--radius-pill); padding: 7px 18px; font-weight: 700; }\n\n/* ---------- bars: recessed wells, not solid blocks ---------- */\n/*\n  A bar is a dark glass well. Four things make it, and losing any one of\n  them drops it back to a flat rectangle:\n\n    - an internal vertical gradient, lighter at the top;\n    - an INSET shadow, so it reads as a recess rather than a slab sitting\n      on the slide. This is the one that does most of the work;\n    - a light hairline border all the way round;\n    - a small corner radius. Not a pill, not square.\n\n  The highlighted bar swaps the dark fill for a lit ramp -- a muted\n  yellow-green at the top, through green, falling to a pale base -- and\n  brightens its border. It carries NO outer glow: the value comes from\n  being the only lit object in a row of dark ones, and a drop shadow\n  around it just muddies the row.\n\n  Values ride above the bar in a small chip (.bar-value-pill), and the\n  series name sits inside the bar at its base (.bar-label-inside). On the\n  lit bar that label has to flip to a dark colour -- its base is pale.\n\n    <div class=\"bar-col\">\n      <span class=\"bar-value-pill\">$200,000</span>\n      <div class=\"bar accent\" style=\"height: 88%;\">\n        <div class=\"bar-label-inside\">Budget (USD)</div>\n      </div>\n      <div class=\"bar-axis-label\">Q4</div>\n    </div>\n*/\n.bar {\n  position: relative;\n  border-radius: 6px;\n  border: 1px solid rgba(255,255,255,0.14);\n  box-shadow:\n    inset 0 2px 16px rgba(0,0,0,0.55),\n    inset 0 1px 0 rgba(255,255,255,0.10);\n}\n.bar.neutral-dark {\n  background: linear-gradient(180deg, rgba(255,255,255,0.085), rgba(255,255,255,0.022));\n}\n.bar.neutral-light {\n  background: linear-gradient(180deg, #EEF1F4, #DCE1E7);\n  border-color: rgba(15,23,42,0.10);\n  box-shadow: inset 0 2px 12px rgba(15,23,42,0.10), inset 0 1px 0 rgba(255,255,255,0.7);\n}\n.bar.accent {\n  background: linear-gradient(180deg,\n    var(--bar-lit-top) 0%,\n    var(--bar-lit-mid) 42%,\n    var(--bar-lit-base) 100%);\n  border-color: rgba(255,255,255,0.34);\n  box-shadow:\n    inset 0 2px 12px rgba(38,58,48,0.26),\n    inset 0 1px 0 rgba(255,255,255,0.45);\n}\n\n/* the value, in a chip above the bar */\n.bar-value-pill {\n  display: inline-flex; align-items: center; white-space: nowrap;\n  padding: 8px 18px; border-radius: var(--radius-pill);\n  background: rgba(255,255,255,0.09);\n  border: 1px solid rgba(255,255,255,0.12);\n  font-size: 22px; font-weight: 600;\n  margin-bottom: 18px;\n}\n/* the series name, inside the bar at its base */\n.bar-label-inside {\n  position: absolute; bottom: 20px; left: 0; right: 0; text-align: center;\n  font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.52);\n}\n.bar.accent .bar-label-inside { color: rgba(22,36,30,0.72); }\n.bar.neutral-light .bar-label-inside { color: rgba(15,23,42,0.5); }\n\n.bar-axis-label { font-size: 20px; font-weight: 500; text-align: center; margin-top: 18px; opacity: 0.65; }\n\n/* A big value baked into the bar instead of floating above it -- for a\n   compact dashboard tile where a chip above every bar would be noise. */\n.bar-value-inside {\n  position: absolute; bottom: 62px; left: 0; right: 0; text-align: center;\n  font-weight: 700; font-size: 40px; color: rgba(255,255,255,0.9);\n}\n.bar.accent .bar-value-inside { color: rgba(18,32,26,0.88); }\n\n/* ---------- donut / ring chart (SVG, not conic-gradient -- gives a\n   true rounded stroke cap on the filled arc, which is what makes it\n   read as drawn rather than a CSS trick) ---------- */\n/*\n  <svg class=\"donut\" viewBox=\"0 0 200 200\" width=\"320\" height=\"320\">\n    <circle class=\"donut-track\" cx=\"100\" cy=\"100\" r=\"80\"/>\n    <circle class=\"donut-value accent\" cx=\"100\" cy=\"100\" r=\"80\"\n      style=\"--donut-offset: 377;\" />  // offset = circumference * (1 - value/100); circumference here = 502.65\n  </svg>\n  Wrap the svg in a position:relative container and absolutely-center a\n  .donut-center label on top for the big number + caption.\n*/\n.donut-track, .donut-value {\n  fill: none; stroke-width: 24; stroke-linecap: round;\n  transform: rotate(-90deg); transform-origin: 50% 50%;\n}\n.donut-track { stroke: rgba(255,255,255,0.08); }\n.donut-track.on-light { stroke: var(--light-border); }\n.donut-value.accent { stroke: var(--accent-500); stroke-dasharray: 502.65; stroke-dashoffset: var(--donut-offset, 0); }\n.donut-wrap { position: relative; display: inline-flex; }\n.donut-center {\n  position: absolute; inset: 0; display: flex; flex-direction: column;\n  align-items: center; justify-content: center;\n}\n\n/* A numbered step / lever list: circles linked by a thin connector so the\n   sequence reads as one object, not a pile of separate badges.\n\n   The circle takes the same treatment as .glass-panel -- a vertical\n   gradient running light at the bottom, plus a conic ring for the\n   refracting edge. That is what keeps it from reading as a glossy plastic\n   bullet, which is what a radial highlight over a solid accent fill gives\n   you. It needs something behind it to blur, so pair the list with a\n   .glow or a .bg-wash-*. */\n.step-circle {\n  position: relative; z-index: 1;\n  width: 64px; height: 64px; border-radius: 50%;\n  background: linear-gradient(180deg,\n    rgba(var(--glass-tint, 150, 178, 240), 0.04),\n    rgba(var(--glass-tint, 150, 178, 240), 0.26));\n  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);\n  box-shadow: 0 14px 30px -12px rgba(0,0,0,0.55);\n  display: flex; align-items: center; justify-content: center;\n  font-weight: 700; font-size: 26px; color: #fff;\n}\n/* The lit edge. It has to be ::before AND z-index:-1: a positioned\n   pseudo-element paints above the parent's inline content whichever one\n   you use, so a plain ::after ring would sit on top of the number. A\n   negative z-index puts it above the circle's own fill and below the\n   number, which is the one place it belongs. */\n.step-circle::before {\n  content: \"\"; position: absolute; inset: 0; border-radius: 50%;\n  padding: 2px; z-index: -1; pointer-events: none;\n  background: conic-gradient(from 130deg,\n    rgba(255,255,255,0.88) 0deg,\n    rgba(255,255,255,0.15) 52deg,\n    rgba(255,255,255,0.64) 118deg,\n    rgba(255,255,255,0.09) 188deg,\n    rgba(255,255,255,0.80) 262deg,\n    rgba(255,255,255,0.17) 322deg,\n    rgba(255,255,255,0.88) 360deg);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor;\n          mask-composite: exclude;\n}\n/* With the circles now neutral glass, the connector carries the slide's\n   accent -- and it has to be light enough to survive against a glow.\n   accent-500 fading to transparent disappeared entirely. */\n.step-connector {\n  width: 3px; flex: 1;\n  background: linear-gradient(180deg, var(--accent-300), rgba(159,179,230,0.06));\n  margin: 0 auto;\n}\n\n/* A 3D funnel: stacked ELLIPSES (not rounded rectangles) that overlap\n   each other and narrow going down, each with a gradient that reads as\n   a lit top face and an inset shadow that reads as the disc's underside.\n   That combination -- ellipse + top-lit gradient + inset shadow -- is\n   what sells the \"stacked physical object\" look; a plain gradient\n   rectangle will not read the same way no matter the gradient angle.\n   Give each stage a decreasing width (e.g. 900px, 760px, 620px, 480px)\n   and a negative margin-top of roughly 35% of its height so it tucks\n   into the one above it.\n   <div class=\"funnel\">\n     <div class=\"funnel-stage\" style=\"width:900px;height:220px;\">\n       <span class=\"pill neutral-light pill-badge\"><span>Leads</span><span class=\"pill-badge-value\">1000</span></span>\n     </div>\n     <div class=\"funnel-stage\" style=\"width:760px;height:200px;margin-top:-70px;\">...</div>\n   </div>\n*/\n.funnel { display: flex; flex-direction: column; align-items: center; }\n.funnel-stage {\n  border-radius: 50%;\n  background: linear-gradient(180deg, var(--accent-300) 0%, var(--accent-600) 55%, var(--accent-900) 100%);\n  box-shadow: 0 28px 48px -16px rgba(0,0,0,0.5), inset 0 -22px 30px -8px rgba(0,0,0,0.35), inset 0 10px 20px -6px rgba(255,255,255,0.25);\n  display: flex; align-items: center; justify-content: center;\n  position: relative;\n}\n\n/* ---------- process chain: overlapping circles, each holding its own text ---------- */\n/*\n  Three circles running left to right, each carrying a step of a short\n  process. Four things define it:\n\n    - They GROW left to right, and not timidly. The last step wants to\n      be well over half again the diameter of the first (420 / 540 / 680\n      here) or the progression reads as an accident.\n    - They stack front to back starting on the LEFT, so the leftmost\n      circle is on top and each one behind the last. Layering it the\n      other way is the easy mistake and it reverses the reading order.\n    - The first circle is a light solid, the second the accent with its\n      radial origin at the BOTTOM RIGHT rather than the middle, so the\n      light in it sits low and off-centre.\n    - The last circle is BLURRED into a soft glow with no crisp edge. The\n      blur goes on the fill only (.step-fill.soft), never on the step, or\n      the text blurs with it. That is why fill and text are two elements.\n\n  Text is centred in the circle, bullets included, and sized to about\n  76% of the diameter so it never touches the curve. The smallest circle\n  is what sets that number -- check the copy fits there first.\n\n  <div class=\"process-chain\" style=\"top:540px; left:830px; width:1510px; height:680px;\">\n    <div class=\"process-step\" style=\"--d:680px; left:830px; top:0;   z-index:1;\">\n      <div class=\"step-fill soft\"></div>\n      <div class=\"step-text\">...</div>\n    </div>\n    <div class=\"process-step\" style=\"--d:540px; left:360px; top:70px; z-index:2;\">\n      <div class=\"step-fill accent\"></div><div class=\"step-text\">...</div>\n    </div>\n    <div class=\"process-step\" style=\"--d:420px; left:0;     top:130px; z-index:3;\">\n      <div class=\"step-fill light\"></div><div class=\"step-text on-light\">...</div>\n    </div>\n  </div>\n*/\n.process-chain { position: absolute; }\n.process-step { position: absolute; width: var(--d); height: var(--d); }\n.process-step .step-fill { position: absolute; inset: 0; border-radius: 50%; }\n.step-fill.light  { background: radial-gradient(circle at 36% 28%, #FFFFFF, #DCE0E7 90%); }\n.step-fill.accent { background: radial-gradient(circle at 76% 80%, var(--accent-400), var(--accent-600) 58%, var(--accent-700) 100%); }\n.step-fill.soft   {\n  background: radial-gradient(circle at 62% 62%, var(--accent-400), var(--accent-700) 84%);\n  filter: blur(var(--soft-blur, 50px));\n}\n.process-step .step-text {\n  position: absolute; inset: 0; padding: 0 12%;\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  text-align: center; color: #fff;\n}\n.process-step .step-text.on-light { color: var(--light-heading); }\n.step-label { font-size: 30px; font-weight: 600; margin-bottom: 18px; }\n.step-bullets { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 26px; line-height: 1.4; }\n.step-bullets li::before { content: \"\\2022  \"; opacity: 0.6; }\n\n/* A thin decorative stroke circle behind a diagram -- not a glow, just\n   an outline suggesting an orbit/halo. Reference deck uses this behind\n   the Before/After venn on light backgrounds. Size it larger than the\n   shapes it sits behind and nudge it off-center for the \"orbit\" feel\n   rather than a bullseye. */\n.orbit-ring {\n  position: absolute; border-radius: 50%; pointer-events: none;\n  border: 1px solid var(--light-border);\n}\n.orbit-ring.accent { border-color: var(--accent-100); }\n\n/* ---------- glass: frosted, translucent surfaces (a second card language) ---------- */\n/* Use on DARK slides only -- translucency needs something visually rich\n   behind it (a glow, a wash, an image) to read as \"glass\" rather than\n   just a faint gray box. Don't mix with .card on the same slide's cards;\n   pick one language per slide. */\n/* The glass comes from two things and neither is a flat fill:\n\n   1. A subtle INTERNAL VERTICAL gradient. Grey to grey is the default and\n      reads as glass on any ground; swap in --glass-tint for a coloured\n      variant. Keep the range narrow -- a strong gradient reads as a\n      painted panel, not as a transparent one.\n   2. An edge where the light REFRACTS. The ring below is a conic gradient\n      masked to a 2px band, so its brightness travels around the perimeter\n      and lands bright on two opposite edges with dim runs between. A\n      single even border is the thing that makes glass look like a grey\n      box. */\n.glass-panel {\n  position: relative;\n  background: linear-gradient(180deg,\n    rgba(var(--glass-tint, 200, 206, 218), 0.02),\n    rgba(var(--glass-tint, 200, 206, 218), 0.24));\n  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);\n  border-radius: var(--radius-lg);\n  box-shadow: 0 24px 48px -20px rgba(0,0,0,0.55);\n  padding: 40px;\n}\n.glass-panel::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: inherit;\n  padding: 2px; pointer-events: none;\n  background: conic-gradient(from 130deg,\n    rgba(255,255,255,0.88) 0deg,\n    rgba(255,255,255,0.15) 52deg,\n    rgba(255,255,255,0.64) 118deg,\n    rgba(255,255,255,0.09) 188deg,\n    rgba(255,255,255,0.80) 262deg,\n    rgba(255,255,255,0.17) 322deg,\n    rgba(255,255,255,0.88) 360deg);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor;\n          mask-composite: exclude;\n}\n.glass-panel > * { position: relative; z-index: 1; }\n\n/* ---------- glass lenses: narrow oval cylinders in a receding stack ---------- */\n/*\n  The motif is a row of LENSES -- narrow vertical ovals with real\n  cylindrical depth -- not flat circles, which is the easy mistake.\n\n  Each lens is two ellipses: .lens-face is the front glass, and\n  .lens-side is the same ellipse nudged LEFT behind it so a thin crescent\n  of the cylinder wall shows past the face's left edge, over the lens\n  behind it. Both are translucent and blurred, the side markedly more\n  transparent than the face; the blur plus a light transparent tint inside\n  the oval is the whole glass effect.\n\n  Rules:\n    - Ovals, not circles. Width is roughly 0.53 of height.\n    - They shrink from left to right and overlap heavily, and each is\n      layered BELOW the one to its right, so the rightmost sits on top.\n    - Tint them from the right: light blue, then teal, then grey, then a\n      grey so transparent it is barely there.\n    - ONE soft line (.lens-axis) lies in the background through every\n      centre. It must be several pixels tall and carry its own blur: a 1px\n      hairline behind the glass is erased outright by each face's backdrop\n      blur, so it goes missing exactly where it is supposed to read. Do NOT\n      put a specular streak inside each lens either -- with several lenses\n      sharing a centre line those streaks merge into one hard rule across\n      the group.\n\n  Use on DARK slides only -- translucency needs something behind it.\n\n  <div class=\"lens-field\" style=\"top:266px; left:1400px; width:1010px; height:926px;\">\n    <div class=\"lens-axis\"></div>\n    <div class=\"glass-lens\" style=\"--lw:491px; --lh:926px; --lc:150,158,170; --la:0.04; left:0;\">\n      <div class=\"lens-side\"></div><div class=\"lens-face\"></div>\n    </div>\n    ...\n  </div>\n*/\n.lens-field { position: absolute; }\n/* The axis sits BEHIND the lenses, and it has to be wide and pre-blurred\n   to survive being there. A 1px hairline behind the glass is annihilated\n   by each face's backdrop blur -- measured, it registers nothing at all\n   inside the ovals. Give it real height and its own blur and the total\n   luminance survives, spread soft, which is what reads as a line lying in\n   the background rather than a rule drawn over the glass. Keep it FIRST in\n   the markup so the whole stack paints over it. */\n.lens-axis {\n  position: absolute; top: 50%; left: -320px; right: -220px; height: 8px;\n  transform: translateY(-50%);\n  filter: blur(5px);\n  background: linear-gradient(90deg,\n    transparent,\n    rgba(255,255,255,0.42) 22%,\n    rgba(255,255,255,0.55) 58%,\n    rgba(255,255,255,0.26) 88%,\n    transparent);\n}\n.glass-lens {\n  position: absolute; top: 50%; transform: translateY(-50%);\n  width: var(--lw); height: var(--lh);\n}\n.glass-lens .lens-side, .glass-lens .lens-face { position: absolute; inset: 0; border-radius: 50%; }\n.glass-lens .lens-side {\n  transform: translateX(var(--ld, -28px));\n  background: rgba(var(--lc), calc(var(--la) * 0.40));\n  -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px);\n  border: 1px solid rgba(255,255,255,0.06);\n}\n.glass-lens .lens-face {\n  background: linear-gradient(155deg,\n    rgba(var(--lc), calc(var(--la) * 1.35)),\n    rgba(var(--lc), calc(var(--la) * 0.40)));\n  -webkit-backdrop-filter: blur(11px); backdrop-filter: blur(11px);\n  border: 1px solid rgba(255,255,255,0.13);\n  box-shadow: inset 0 3px 12px rgba(255,255,255,0.06);\n}\n\n/* ---------- glass cutout: one stepped shape with two concave fillets ---------- */\n/*\n  The second glass layout, and it is NOT two overlapping rectangles. Trace\n  the reference outline and it closes as a single continuous stepped shape:\n  an upper-left block whose right edge drops to meet the top edge of a\n  wider lower-right block, and whose bottom edge meets that block's left\n  edge. Both of those meetings are CONCAVE corners, filleted like every\n  other corner. One shape, so one gradient runs across the whole composite.\n\n  The two edges that link the blocks are ANGLED at about 50 degrees, not\n  vertical, and their four junctions take a much smaller radius than the\n  outer corners. A vertical link with a large radius reads as two boxes\n  awkwardly glued; the diagonal is what makes it one object.\n\n  The gradient runs light at the BOTTOM, dark at the top.\n\n  A second, dimmer copy of the shape sits behind and below the first\n  (.cut-ghost), offset down and right, so only its bottom and right\n  contours show. That is what reads as stacked sheets of glass.\n\n  Two mechanics make it work:\n\n  - The silhouette is a clip-path, which rules out the ::after ring used by\n    .glass-panel: a mask band follows border-radius, not a clip-path, so\n    the concave arcs would come out unbordered. The edge is an inline SVG\n    stroke over the same path, with a diagonal gradient -- because that\n    gradient is spatial rather than along the path, different runs of the\n    perimeter pick up different brightness, which is the refraction read.\n\n  - The path is declared ONCE, as an SVG <path> in <defs>. The fill clips\n    to it via a <clipPath><use>, and the edge strokes it via a <use>.Writing\n    the path twice (once for clip-path, once for the d attribute) is how\n    the two drift apart the first time a size changes.\n\n  Arc flags, traversing clockwise: convex corners take sweep-flag 1,\n  concave corners take sweep-flag 0. Getting a concave flag wrong bulges\n  the corner outward and the step disappears.\n\n  <svg width=\"0\" height=\"0\" style=\"position:absolute\"><defs>\n    <path id=\"cutPath\" d=\"M 40 0 L 769 0 A 40 40 0 0 1 809 40 ... Z\"/>\n    <clipPath id=\"cutClip\" clipPathUnits=\"userSpaceOnUse\"><use href=\"#cutPath\"/></clipPath>\n    <linearGradient id=\"glassEdge\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">...</linearGradient>\n  </defs></svg>\n\n  <div class=\"cut-shape\" style=\"left:163px; top:531px; width:2231px; height:750px;\">\n    <div class=\"cut-fill\" style=\"clip-path: url(#cutClip);\"></div>\n    <svg class=\"cut-edge\" viewBox=\"0 0 2231 750\"><use href=\"#cutPath\"/></svg>\n    <div class=\"cut-zone\">...</div>\n  </div>\n*/\n.cut-shape { position: absolute; }\n.cut-fill {\n  position: absolute; inset: 0;\n  background: linear-gradient(180deg,\n    rgba(var(--glass-tint, 200, 206, 218), 0.02),\n    rgba(var(--glass-tint, 200, 206, 218), 0.24));\n  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);\n}\n.cut-edge { position: absolute; inset: 0; overflow: visible; pointer-events: none; }\n.cut-edge use { fill: none; stroke: url(#glassEdge); stroke-width: 2; }\n/* a second sheet of the same shape, stacked below and behind the first --\n   only its bottom and right contours show past the front one */\n.cut-ghost { position: absolute; inset: 0; transform: translate(14px, 26px); opacity: 0.5; }\n.cut-zone { position: absolute; }\n\n/* ---------- divider-list: a plain list separated by hairlines, no card fill ---------- */\n/* Use when content is a short set of label+description pairs that\n   shouldn't compete visually with a card elsewhere on the same slide --\n   a quieter alternative to a card grid. .cols lays it out side by side\n   with vertical rules instead of stacked with horizontal ones. */\n.divider-list { display: flex; flex-direction: column; }\n.divider-list.cols { flex-direction: row; }\n.divider-item { padding: 28px 0; border-bottom: 1px solid var(--dark-rule); }\n.divider-item:last-child { border-bottom: none; }\n.divider-list.cols .divider-item {\n  flex: 1; padding: 0 44px; border-bottom: none; border-right: 1px solid var(--dark-rule);\n}\n.divider-list.cols .divider-item:first-child { padding-left: 0; }\n.divider-list.cols .divider-item:last-child { border-right: none; padding-right: 0; }\n.divider-list.light .divider-item { border-color: var(--light-rule); }\n\n/* ---------- ambient background wash: a soft glow bleeding in from one edge ---------- */\n/* A quieter, more atmospheric alternative to .glow for a dark slide's\n   overall mood -- not positioned behind a specific diagram, just felt\n   across the whole canvas. Place as an absolutely-positioned full-bleed\n   div, first child of .slide, behind everything else. */\n.bg-wash-right {\n  position: absolute; inset: 0; pointer-events: none; z-index: 0;\n  background: radial-gradient(55% 90% at 100% 50%, var(--teal-glow) 0%, transparent 70%);\n}\n\n/* ---------- band field: gradient rectangles anchored to one corner ---------- */\n/* A more architectural alternative to .glow for a dark slide's background:\n   a row of equal-width rectangles in one corner, each a slightly different\n   value, the whole field fading out down the canvas.\n\n   The construction is exact -- these are not stylistic suggestions, they\n   are what makes it read as faceted panels instead of a wash:\n\n     - FIVE rectangles, EQUAL width, TOUCHING. One rectangle is 1/16th of\n       the slide width (160px here), so the field is 5/16ths -- 800px. They\n       are flex: 1, so they stay equal whatever --field-w is set to.\n     - Each rectangle carries its own base value in --bc, stepping DARKER\n       FROM RIGHT TO LEFT. The right edge of the field is the lightest.\n     - Inside each rectangle, a small gradient runs LIGHTER ON THE LEFT to\n       DARKER ON THE RIGHT. This is the detail that does the real work: it\n       puts a step up in value at every boundary, which is what defines the\n       vertical edges and makes each rectangle read as its own lit panel.\n       Without it the row is just five flat blocks.\n     - The whole field crops out toward the bottom, via a mask on the\n       container rather than per-rectangle stops, and the mask is tilted a\n       few degrees off vertical so it crops higher on the left than on the\n       right. Because the mask varies along its own axis, the rectangles'\n       vertical edges stay crisp through it.\n\n   Two constructions that look plausible and both fail: one shared colour\n   at varying opacity reads as translucent sheets stacked on each other,\n   and full-height stripes with per-rectangle fade depths make the darker\n   neighbour look like it continues behind the brighter one.\n\n   Values are opaque, so calibrate them against the slide background\n   directly rather than guessing at an opacity.\n\n   <div class=\"band-field\">\n     <div class=\"band\" style=\"--bc: 23,30,42;\"></div>\n     <div class=\"band\" style=\"--bc: 28,38,54;\"></div>\n     <div class=\"band\" style=\"--bc: 34,47,68;\"></div>\n     <div class=\"band\" style=\"--bc: 41,58,84;\"></div>\n     <div class=\"band\" style=\"--bc: 49,70,103;\"></div>\n   </div>\n*/\n.band-field {\n  position: absolute; top: 0; right: 0;\n  width: var(--field-w, 800px); height: var(--field-h, 1440px);\n  display: flex; align-items: stretch;\n  pointer-events: none; z-index: 0;\n  /* Tilted off vertical (188deg rather than 180deg) so the field crops\n     higher on the left than on the right. The tilt is along the mask's own\n     axis, so the rectangles' vertical edges stay crisp. */\n  -webkit-mask-image: linear-gradient(188deg, #000 0%, rgba(0,0,0,0.9) 22%, rgba(0,0,0,0.45) 41%, transparent 56%);\n          mask-image: linear-gradient(188deg, #000 0%, rgba(0,0,0,0.9) 22%, rgba(0,0,0,0.45) 41%, transparent 56%);\n}\n.band-field .band {\n  flex: 1;\n  background-image:\n    linear-gradient(90deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.17) 100%),\n    linear-gradient(0deg, rgb(var(--bc)), rgb(var(--bc)));\n}\n\n/* ---------- quad grid: one claim on the left, four breakdowns on the right ---------- */\n/*\n  The dense slide, and the only layout here that is allowed to be dense.\n  Left column: title plus a .lede paragraph, which set the main point.\n  Right: a 2x2 grid of quadrants, each with a small index number top-left\n  and a short title over a short paragraph, breaking that point into four.\n  Two of the four quadrants carry an abstract texture instead of a fill.\n\n  Four things make it, and the last two are what stop it looking like a\n  table with rounded corners deleted:\n\n  - **The hairlines come from the GAP, not from borders.** The container\n    paints the rule colour and carries a 1px gap; each light quadrant\n    paints the slide background over it. One rule per division, no doubled\n    edges to reconcile, and a textured quadrant simply covers its own share\n    of the grid so its edges disappear -- which is what the reference does\n    and what makes the textured cells read as windows cut into the grid\n    rather than as tiles sitting in it.\n  - **All four titles align on one line.** The index number is pinned to\n    the top and the title sits a FIXED distance below it, so the four\n    titles land on the same baseline whatever their body length. The\n    obvious construction -- bottom-anchor the text block with margin-top:\n    auto -- gives four titles at four different heights the moment one body\n    runs a line longer, and the ragged result is exactly the structure this\n    layout is selling.\n  - **The textured quadrants take the diagonal**, 02 and 03. Putting them\n    side by side splits the grid into a light half and a dark half; on the\n    diagonal they hold the whole grid together.\n  - **A textured quadrant needs a scrim.** The texture is at its most\n    active where the body copy sits, so a bottom-weighted dark gradient\n    goes over the texture and under the text. Without it the copy is\n    legible in some columns of the texture and not others, which no amount\n    of colour picking fixes.\n\n  **This layout is LIGHT ONLY.** Its whole contrast structure is dark\n  textures reading as windows cut into a light grid, and it does not\n  invert: .tex-fins is within a few values of --dark-bg, so on a dark\n  slide that quadrant vanishes and the grid loses half its composition. A\n  dark version is a different exercise needing light-on-dark textures, not\n  a class on this one.\n\n  Density: this layout can hold four paragraphs, which does not make it\n  exempt from copy-discipline.md. Hold each quadrant body to its 25-word\n  ceiling. At 23px in a 460px column that is still four lines per\n  quadrant, so the slide looks as dense as the reference while staying\n  inside the budget.\n*/\n.quad-grid {\n  position: absolute; z-index: 1;\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  grid-template-rows: 1fr 1fr;\n  gap: 1px;\n  background: var(--light-rule);\n  border: 1px solid var(--light-rule);\n}\n.quad { position: relative; overflow: hidden; padding: 50px; }\n.quad.plain { background: var(--light-bg); }\n.quad > * { position: relative; z-index: 2; }\n/* the scrim, over a texture and under the copy */\n.quad.on-tex::before {\n  content: \"\"; position: absolute; inset: 0; z-index: 1; pointer-events: none;\n  background: linear-gradient(180deg,\n    transparent 16%, rgba(4,6,12,0.52) 50%, rgba(4,6,12,0.80) 100%);\n}\n.quad-num {\n  font-size: 22px; font-weight: 500; letter-spacing: 1.5px;\n  font-variant-numeric: tabular-nums; color: var(--light-muted);\n}\n/* The fixed drop is what aligns the four titles. Re-derive it if the\n   quadrant size changes: it puts the title cap at about 45% of cell\n   height, and leaves room for a body of four or five lines under it. */\n.quad-text { margin-top: 176px; }\n.quad-title { font-size: 32px; font-weight: 600; margin-bottom: 18px; }\n.quad-body { font-size: 23px; line-height: 1.6; color: var(--light-body); }\n.quad.on-tex .quad-num { color: rgba(255,255,255,0.62); }\n.quad.on-tex .quad-title { color: #fff; }\n.quad.on-tex .quad-body { color: rgba(255,255,255,0.84); }\n\n/* ---------- abstract textures for a quad-grid cell ---------- */\n/*\n  Generated, not photographed. Two reasons that matters beyond the artifact\n  CSP blocking external images: a gradient stack re-colours to the brand\n  accent in one place, and it stays sharp at any cell size, which a crop of\n  a bitmap does not.\n\n  Both follow the same rule as every other surface here -- direction and a\n  lit edge, never a flat wash.\n\n  .tex-streak, long-exposure light smeared vertically. Horizontal bands of\n  accent blue over wide black runs, a blown-out top right, and crisp\n  vertical hairlines. The hairlines and the dark smears each run at TWO\n  coprime periods, because a single period combs into a barcode: the eye\n  locks onto the repeat and the texture stops reading as motion. Keep the\n  dark smears wide and low-alpha for the same reason -- narrow and opaque\n  is a barcode however you space it.\n\n  .tex-fins, diagonal lit ridges. One repeating gradient per fin: dark\n  trough, a 2px lit edge, dark again. A second pass at 121.5deg against the\n  first's 118deg gives the ridges a slight wander instead of dead-straight\n  ruling, which is the difference between a photographed surface and a CSS\n  pattern. Two radial gradients on top vary the lighting across the panel\n  so it is not uniformly lit.\n*/\n.tex-streak {\n  background:\n    repeating-linear-gradient(90deg,\n      transparent 0 41px, rgba(233,242,255,0.62) 41px 43px, transparent 43px 79px),\n    repeating-linear-gradient(90deg,\n      transparent 0 56px, rgba(214,228,255,0.26) 56px 57px, transparent 57px 103px),\n    repeating-linear-gradient(90deg,\n      rgba(0,0,0,0.34) 0 16px, transparent 16px 71px),\n    repeating-linear-gradient(90deg,\n      rgba(0,0,0,0.22) 0 9px, transparent 9px 43px),\n    radial-gradient(135% 58% at 92% 2%,\n      rgba(232,240,255,0.95) 0%, rgba(160,184,230,0.38) 32%, transparent 64%),\n    linear-gradient(180deg,\n      #03050b 0%, #060c1c 10%,\n      var(--accent-600) 26%, #101f4e 36%,\n      #03050b 46%,\n      var(--accent-600) 58%, #0c1740 68%,\n      #03050b 77%,\n      var(--accent-500) 90%, var(--accent-700) 100%);\n}\n.tex-fins {\n  background:\n    radial-gradient(115% 100% at 8% 4%, rgba(255,255,255,0.16), transparent 62%),\n    radial-gradient(80% 80% at 96% 86%, rgba(255,255,255,0.07), transparent 60%),\n    repeating-linear-gradient(118deg,\n      #08080a 0px, #0e0e12 12px,\n      #2e3037 21px, #8d929b 23px, #35373e 25px,\n      #121216 34px, #08080a 45px);\n}\n/* the wander pass. It sits under the scrim and the copy. */\n.tex-fins::after {\n  content: \"\"; position: absolute; inset: 0; z-index: 0; opacity: 0.45;\n  background: repeating-linear-gradient(121.5deg,\n    transparent 0px, transparent 16px,\n    rgba(255,255,255,0.09) 22px, transparent 28px, transparent 49px);\n}\n\n/* ---------- share split: 2-3 numbers over a field of 100 unit circles ---------- */\n/*\n  A percentage made countable. Two or three big numbers across the top, and\n  under them a field of 100 circles with the shares painted into it left to\n  right. It exists because a bare percentage is abstract in a way an\n  audience cannot picture, and one hundred circles with sixty-nine of them\n  lit is a quantity someone can actually see.\n\n  Use it for a distribution of TWO or THREE parts of one whole -- queries\n  that run against queries that do not, or easy / medium / complex. Four\n  parts and the field stops being readable at a glance; a change over time\n  is a bar chart instead.\n\n  THE FIELD IS 100 CIRCLES, 5 ROWS OF 20. That is the whole point and it is\n  worth resisting a prettier grid for: one circle is one percent, so the\n  boundary between two shares lands on an exact circle and a viewer can\n  count it. The reference for this layout used 4 rows of 16, which is 64\n  circles at 1.5625% each, and its 69% boundary came out as a ragged\n  staircase that ends on a different column in three of the four rows --\n  the tell that the picture and the number disagree.\n\n  FILL ORDER IS COLUMN-MAJOR: down each column, then rightward. This is\n  the difference between the layout working and not working, and it is not\n  the order CSS grid gives you by default. Filling row by row means a 69%\n  share becomes three full rows, a partial fourth and an empty fifth --\n  which the eye reads as horizontal BANDS stacked down the slide, a\n  progress bar wrapped onto five lines. The two populations have to stand\n  side by side as two vertical blocks, because side by side is what \"two\n  parts of one whole\" looks like. Hence grid-auto-flow: column against\n  explicit grid-template-rows.\n\n  The consequence to accept: one column is five percent, so only a share\n  landing on a multiple of five gives a perfectly straight boundary.\n  Anything else leaves a single one-circle notch at the bottom of the\n  partial column, which is the honest thing to show -- it is where the\n  real number falls. Do not round the data to straighten the edge.\n\n  Brightest share first, remainder last on the right. Never distribute a\n  share across the field or interleave it.\n\n  Measured proportions, as percentages of slide height:\n\n    | big number digit top | 23.9% |\n    | big number baseline  | 36.0% |\n    | note cap top         | 40.6% |\n    | field top            | 52.0%, same line the stat rail starts on |\n    | field bottom         | ~90.5% |\n\n  The numbers:\n\n  - **The bright one is 239px at weight 800** (16.6% of slide height),\n    which is far past .stat.xl and correct here. It is the only figure on\n    the slide carrying real weight, so it gets all of it -- the same\n    reasoning that takes the stat rail's four numbers DOWN to 500. Stat\n    weight is a function of how many stats share the slide.\n  - **The remainder is the same size and near the background.**\n    --dark-muted, and its note too. It reads as barely there on purpose:\n    it is the share the slide is arguing against, and making it legible\n    gives it equal billing.\n  - **With three shares the second one goes in the MIDDLE**, in --teal-*,\n    left number bright, right number muted. This is the documented job of\n    the second hue: three shades of one blue are much harder to tell apart\n    at a glance than blue against teal against grey. Placing it centred on\n    the canvas rather than over its own run of circles keeps the three\n    numbers a clean triptych, which is worth more than the alignment.\n\n  The circles, and both details came from the brief rather than the render:\n\n  - **The fill gradient comes from a SIDE, not the centre.** A linear\n    gradient at 118deg, so the light has a direction across the whole\n    field and every circle is lit the same way. A radial origin inside the\n    circle turns each one into an individual sphere and the field reads as\n    a bag of marbles instead of one surface.\n  - **The reflections sit on the SIDES.** The same masked conic ring the\n    card system uses for its refracting edge, phased so its two bright\n    runs land at 90deg and 270deg -- the left and right edges. Our other\n    conic rings start at 130deg, which puts the brights on the diagonals;\n    on a circle this small that reads as a smudge rather than a rim light.\n\n  <div class=\"unit-field\" style=\"left:160px; top:748px; width:2240px;\">\n    <div class=\"unit filled\"></div> ... x69\n    <div class=\"unit rest\"></div>   ... x31\n  </div>\n*/\n.unit-field {\n  position: absolute; z-index: 1;\n  display: grid;\n  /* Column-major. The rows are explicit and the columns are implicit, which\n     is what makes items flow DOWN a column before starting the next one. */\n  grid-auto-flow: column;\n  grid-template-rows: repeat(var(--rows, 5), 1fr);\n  grid-auto-columns: 1fr;\n  gap: var(--unit-gap, 6px);\n}\n/* The field needs an explicit height as well as a width, because 1fr rows\n   have nothing to resolve against otherwise. For 100 circles on a 2240px\n   width at gap 6, square cells want height 555px:\n     cell = (2240 - 19*6) / 20 = 106.3   ->   5*106.3 + 4*6 = 555\n   Re-derive both if the width, the gap or the row count changes. */\n.unit { position: relative; border-radius: 50%; }\n/*\n  Light from the upper left, ACROSS THE FIELD rather than per circle. Every\n  circle carries the same 118deg ramp, so the whole field reads as one\n  surface under one light. A radial origin inside each circle makes each one\n  its own little sphere and the field becomes a bag of marbles.\n\n  The ramps are --orb-* (see the token block at the top), three stops in a\n  narrow band. Two things about them are easy to get wrong in opposite\n  directions:\n\n    - A WIDE ramp makes a circle look like it is fading out, and a field of\n      them looks switched off. This was the first failure here: accent-400\n      down to accent-700 put most of each circle's area in navy.\n    - The fix is NOT to pull the whole ramp brighter, which is the obvious\n      next move and lands on stock office blue. It is to narrow the range\n      and place it a step deeper than the accent mid-tones. A narrow deep\n      band reads as one considered material; a wide bright one reads as a\n      default chart fill.\n\n  The second share must not be BRIGHTER than the first, and a green needs\n  far more darkening than intuition suggests to get there -- green is the\n  hue the eye is most sensitive to, so a green and a blue that look\n  comparably dark as hex values are nowhere near it on screen. Measure the\n  two ramps' luminance rather than trusting the swatch. Level is the\n  target, not dimmer: the two shares are peer categories and the ranking\n  between them is carried by their numbers.\n*/\n.unit.filled {\n  background: linear-gradient(118deg,\n    var(--orb-blue-1) 0%, var(--orb-blue-2) 52%, var(--orb-blue-3) 100%);\n}\n.unit.second {\n  background: linear-gradient(118deg,\n    var(--orb-green-1) 0%, var(--orb-green-2) 52%, var(--orb-green-3) 100%);\n}\n.unit.rest {\n  background: linear-gradient(118deg,\n    rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.105) 52%, rgba(255,255,255,0.055) 100%);\n}\n/* The reflections: a conic ring masked to a 2px band, phased so the bright\n   runs land on the left and right edges. */\n.unit::after {\n  content: \"\"; position: absolute; inset: 0; border-radius: 50%;\n  padding: 2px; pointer-events: none;\n  background: conic-gradient(from 0deg,\n    rgba(255,255,255,0.03)  0deg,\n    rgba(255,255,255,0.58)  90deg,\n    rgba(255,255,255,0.03) 180deg,\n    rgba(255,255,255,0.50) 270deg,\n    rgba(255,255,255,0.03) 360deg);\n  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);\n  -webkit-mask-composite: xor;\n          mask-composite: exclude;\n}\n.unit.rest::after { opacity: 0.5; }\n\n.share-num { font-weight: 800; font-size: 239px; line-height: 1; letter-spacing: -5px; }\n.share-num.second { color: var(--orb-green-type); }\n.share-num.rest { color: var(--dark-muted); }\n.share-note { font-size: 28px; line-height: 1.55; color: var(--dark-body); }\n.share-note.rest { color: var(--dark-muted); }\n\n/* ---------- stat rail: one claim over 3-4 numbers in hairline columns ---------- */\n/*\n  A claim at hero size in the top-left, and under it a row of columns each\n  holding a small label, a large number, and a hairline down its left edge\n  linking the two. The most compact way this system can put evidence under\n  an assertion, and the calmest -- there are no cards, no fills and no\n  icons, so the only things on the canvas are type and four hairlines.\n\n  IT IS A RHYTHM, NOT A GRID OF STAT CARDS, and the proportions are what\n  make it read as one. All four are measured off the reference and given\n  here as percentages of slide height so they survive a canvas change:\n\n    | claim cap top                  | 16.3% |\n    | rule top, = every column's top | 52.0% |\n    | label cap top                  | 54.1% |\n    | number baseline                | 91.4% |\n    | rule bottom                    | 100%, bleeding off the slide |\n\n  Three of those deserve saying out loud, because each one looks like a\n  mistake in isolation:\n\n  - **The rule starts at 52%.** The numbers own the whole bottom half and\n    the claim owns the top. Pull the rail up to close the gap and the slide\n    turns into a title with a stat strip under it, which is a different and\n    much more ordinary slide.\n  - **The void between label and number is 27% of the slide height** -- the\n    largest single empty area on the canvas, and deliberate. This is the\n    one place `justify-content: space-between` is correct rather than the\n    failure described in design-system.md section 8: there the gap is\n    accidental, left over because content did not reach the bottom of a\n    container it was stretched into. Here the label is pinned to the top of\n    the column and the number to the bottom, the distance between them is\n    the same in every column, and it is that shared distance that makes the\n    row read as one object. Fill it with a sparkline or a note and the\n    layout collapses.\n  - **The rule keeps going past the number and off the bottom edge.**\n    Stopping it under the number closes each column into a box, and four\n    boxes is a card grid with the fills deleted. Running off the canvas is\n    what keeps them as columns.\n\n  Dropping to three numbers or two REMOVES COLUMNS FROM THE LEFT and leaves\n  the rest where they were: the rail is anchored right, the column width is\n  fixed, and the vacated slot becomes more breathing room under the claim.\n  Re-flowing three columns across the full width instead changes the pitch,\n  and a deck whose stat rails have different pitches slide to slide loses\n  the one thing this layout is for.\n\n  Accent: keep the numbers even. Their sameness is the point, so a single\n  .stat-accent-part on the unit character of the ONE number the claim\n  actually leans on is the whole accent budget for the slide.\n\n  <div class=\"stat-rail\" style=\"top:748px;\">\n    <div class=\"rail-col\">\n      <div class=\"rail-label\" >Annual savings</div>\n      <div class=\"stat xl\">$1.2M</div>\n    </div>\n    ... x3\n  </div>\n*/\n.stat-rail {\n  position: absolute; right: 160px; bottom: 0;\n  display: grid; grid-auto-flow: column;\n  grid-auto-columns: var(--rail-col, 560px);\n  z-index: 2;\n}\n.rail-col {\n  position: relative;\n  display: flex; flex-direction: column; justify-content: space-between;\n  /* --rail-foot is what puts the number's baseline at 91.4% and leaves the\n     rule running the last 8.6% off the slide. It is derived from the type:\n     at 150px/line-height 1 the baseline is 129.5px below the box top, so\n     1440 - 1317 - (150 - 129.5) = 102. Re-derive it if the size changes. */\n  padding: var(--rail-label-drop, 26px) 24px var(--rail-foot, 102px) var(--rail-indent, 42px);\n}\n/* The hairline: the column's left edge, top to bottom, running past the\n   number and off the slide. A card border could be almost subliminal here;\n   this rule is the only structure on the slide, so it takes the brighter\n   --*-rule value. */\n.rail-col::before {\n  content: \"\"; position: absolute; left: 0; top: 0; bottom: 0;\n  width: 1px; background: var(--light-rule);\n}\n.rail-col.on-dark::before { background: var(--dark-rule); }\n/* Card-title size (2.2% of height): this line titles its column, and at\n   body size it goes weedy against a number this large. */\n.rail-label { font-size: 32px; font-weight: 500; line-height: 1.35; color: var(--light-body); }\n.rail-label.on-dark { color: var(--dark-body); }\n/*\n  The rail's numbers OVERRIDE the deck's 800-weight stat, down to 500, and\n  run larger to compensate (150px, the reference's 10.4% of slide height).\n  This is a deliberate layout exception in the same class as the cover's\n  light title, and it is worth knowing why rather than treating it as a\n  taste call: .stat is 800 because a stat is normally ONE figure inside a\n  card, competing with the card's own title and body for focus, and weight\n  is how it wins. Here there are four figures at hero size with nothing\n  else on the canvas at all. They cannot fail to be the focus, so the\n  weight buys nothing and costs the slide its calm -- four 800-weight\n  numbers at this size read as a row of black slabs and bury the\n  300-weight claim above them, which is the one thing the numbers are\n  supposed to be serving.\n\n  With label and number on the same weight, the hierarchy comes entirely\n  from size: 32px against 150px is 4.7x, straight down the middle of the\n  4-6x band in design-system.md's DNA rule 1.\n*/\n.rail-col .stat { font-size: 150px; font-weight: 500; letter-spacing: -2px; }\n\n/* ---------- statement frame: small note in one corner, the claim in the other ---------- */\n/*\n  A whole-slide composition rather than a component. Three things only: a\n  small block of detail in the TOP-LEFT corner, one diagram across the\n  middle band, and the slide's claim at hero size in the BOTTOM-RIGHT,\n  right-aligned. The middle of the canvas carries nothing but the diagram,\n  which is what makes the two text blocks read as opposite ends of a\n  diagonal instead of as a header and a footer.\n\n  Direction is not arbitrary. Detail first, then the thing itself, then\n  the verdict last and largest, following the reading diagonal. Flipping\n  the two corners puts the verdict where the eye starts and the diagram\n  stops being the argument.\n\n  The claim wants a period and no subtitle under it. There is nothing else\n  on the slide competing, so anything added here reads as a hedge.\n\n  <div class=\"corner-note\">\n    <div class=\"subtitle light\">Most of what your company knows is in ...</div>\n  </div>\n  ... diagram ...\n  <div class=\"hero-statement\"><div class=\"title xl\">Nobody can read ...</div></div>\n*/\n.corner-note { position: absolute; top: 200px; left: 160px; width: 900px; z-index: 2; }\n.hero-statement {\n  position: absolute; right: 160px; bottom: 150px;\n  width: 2000px; text-align: right; z-index: 2;\n}\n/* Mirrored: note top-right, claim bottom-left. Use only when something\n   else on the slide already pulls the eye rightward first. */\n.corner-note.right { left: auto; right: 160px; text-align: right; }\n.hero-statement.left { right: auto; left: 160px; text-align: left; }\n\n/* ---------- scatter → order: structure coming out of a mess ---------- */\n/*\n  Loose dots on the left, a hairline arrow, the same dots in a grid on the\n  right. It says \"this thing brings order\" before a word of the slide is\n  read, and it is the one diagram in this system that argues by ARRANGEMENT\n  rather than by size, quantity or sequence. Reach for it when the claim is\n  about structure appearing, and for nothing else -- a two-state\n  before/after that is really about a *quantity* changing belongs in\n  .bar-col or the Venn pair.\n\n  What makes it work, in order of how easily each one is lost:\n\n    - The scattered side is DULLER than the ordered side, in exactly the\n      way an unlit shape is duller than a lit one. Neutral grey against\n      accent blue. Both sides in accent, or both neutral, and the diagram\n      says nothing at all.\n    - The scattered dots are the SAME SIZE as the ordered ones and there\n      are one or two MORE of them, one of those sitting well away from the\n      cluster. Same size means the eye reads a rearrangement of the same\n      material; varying the sizes turns it into a chart about magnitude.\n    - No dot touches another. Place them by real coordinates with roughly\n      120px between centres at --dot 86px, and check the render -- a\n      scatter that looks random usually is not, and a scatter generated\n      from a small jitter around a grid reads as a grid.\n    - The arrow is a HAIRLINE with a small open chevron. It is\n      punctuation between the two states. An arrow with any weight to it\n      becomes the third object on the slide and the composition flattens.\n    - The grid is square (3x3) with a gap around 0.6 of the dot diameter,\n      so the dots read as spaced rather than as a block of colour.\n\n  A .glow.accent centred on the ordered grid is the natural pairing: the\n  grid is a shape cluster, which is what the glow exists to light, and\n  putting the light on the ordered half rather than in the middle means the\n  background itself is making the argument. Keep it off the scattered side.\n  On a DARK slide run it near full strength. On a light slide hold it under\n  about 0.18 opacity: a blue glow on white goes grey before it goes bright,\n  so anything stronger reads as a smudge with a visible edge rather than as\n  light, and the ordered dots' own drop shadows are already doing most of\n  the lifting there.\n\n  <div class=\"scatter-field\" style=\"left:340px; top:420px; width:623px; height:497px;\">\n    <div class=\"dot chaos\" style=\"left:19px;  top:100px;\"></div>\n    ...\n  </div>\n  <svg class=\"flow-arrow\" style=\"left:1090px; top:645px;\" width=\"450\" height=\"46\" viewBox=\"0 0 450 46\">\n    <path d=\"M0 23 H 428\"/><path d=\"M414 10 L 436 23 L 414 36\"/>\n  </svg>\n  <div class=\"order-grid\" style=\"left:1690px; top:488px;\">\n    <div class=\"dot ordered\"></div> ... x9\n  </div>\n*/\n.scatter-field { position: absolute; z-index: 1; }\n.order-grid {\n  position: absolute; z-index: 1;\n  display: grid;\n  grid-template-columns: repeat(var(--cols, 3), var(--dot, 86px));\n  gap: var(--dot-gap, 51px);\n}\n.dot { width: var(--dot, 86px); height: var(--dot, 86px); border-radius: 50%; }\n.scatter-field .dot { position: absolute; }\n/* Unlit means FLAT, and this is the one place in the system where a nearly\n   flat fill is correct. Give a chaos dot the off-centre radial that\n   .dot.ordered uses and it turns into a pale glass marble with its own\n   highlight -- a lit object, which is exactly what the ordered side is\n   supposed to be the only one of. Keep it to a whisper of a vertical\n   gradient and keep it close in value to the slide behind it. */\n.dot.chaos { background: linear-gradient(180deg, rgba(15,23,42,0.12), rgba(15,23,42,0.085)); }\n.dot.chaos.on-dark { background: linear-gradient(180deg, rgba(255,255,255,0.105), rgba(255,255,255,0.065)); }\n/* Lit: a sphere, not a filled circle. The off-centre radial origin and the\n   inset top highlight are what separate it from a flat accent disc. */\n.dot.ordered {\n  background: radial-gradient(circle at 32% 26%,\n    var(--orb-blue-lit) 0%, var(--orb-blue-2) 58%, var(--orb-blue-3) 100%);\n  box-shadow:\n    0 16px 30px -12px var(--orb-blue-shadow),\n    inset 0 2px 3px rgba(255,255,255,0.26);\n}\n/* Punctuation between the two states, so it stays a hairline. --light-rule\n   is too faint to survive here (see the wire note in design-system.md). */\n.flow-arrow { position: absolute; z-index: 1; overflow: visible; }\n.flow-arrow path {\n  fill: none; stroke: #C3C9D4; stroke-width: 3;\n  stroke-linecap: round; stroke-linejoin: round;\n}\n.flow-arrow.on-dark path { stroke: rgba(255,255,255,0.36); }\n\n/* ---------- band field, lit-corner variant + a stack of glass cards ---------- */\n/*\n  The second dense layout, sibling to the quad grid: title plus a .lede on\n  the left, and on the right a column of 3-5 glass cards standing on a\n  BAND FIELD used as a light source rather than as a corner accent.\n\n  Two things differ from the .band-field the opener uses, and both are\n  what turn a background texture into a light:\n\n  - **It runs the full height of the slide and gets cropped toward the\n    BOTTOM LEFT** (.band-field.lit-corner) instead of fading downward. The\n    brightest bands then read as light entering the top-right corner and\n    falling away across the slide, which is a direction rather than a\n    gradient.\n  - **The bands are STRUCTURE, and .field-blob is the light.** Keep the\n    band ramp flat and dark (roughly luminance 22 up to 88, eased) and let\n    a screened oval supply the brightness. A monotonic left-to-right band\n    ramp can only be a gradient: every row of the field is equally bright,\n    so there is no source. Sixteen bands at 1/32 of the slide width; the\n    opener's five-band 1/16 module is too coarse to read as light.\n  - **The CARDS carry a dark tint, and that is what lets the field be\n    bright.** This is the part that looks backwards and is not. The\n    instinct is to cap the field's brightness so white body copy stays\n    legible on it, and doing that costs the slide the only thing it is\n    for: a capped field reads as a dim strip down the right edge rather\n    than as light. Tint the glass dark instead. A translucent dark panel\n    over a bright field still shows the field through it, just muted, so\n    the card picks up the light while its copy sits on roughly half the\n    luminance. Look at any reference doing this well and the field BETWEEN\n    the cards is visibly brighter than the field inside them.\n\n    That inverts the usual glass tint. `.card` and `.glass-panel` run a\n    light tint from 0.02 at the top to 0.24 at the bottom; a dark tint has\n    to run the other way, heavier at the top and lighter at the bottom, to\n    keep the same lit-at-the-bottom read.\n\n  Values step from near --dark-bg up into the --bar-lit-* family, so the\n  light is the same muted yellow-green the highlighted bar and the orb\n  green already use. Do not reach for a fresh hue here.\n\n  --field-w is 1600px, right-anchored: twenty bands from x960, four of them\n  past the midline. Those four take .band.top-only so they show in the top\n  strip and nowhere else. The dark left column against the lit right IS the\n  composition, and a faded top strip is the only licence it gets -- un-faded\n  bands past centre put structure into the left column and the whole thing\n  collapses into one busy slide.\n\n  The cards are .glass-panel, so the field shows through them blurred and\n  each card picks up the brightness of whatever it stands on. Place the\n  stack INSIDE the field but short of its right edge, leaving the two\n  brightest bands exposed in the margin beside the cards. That strip is\n  the highlight; run the cards over it and the brightest thing on the\n  slide ends up behind body copy.\n*/\n/* A RADIAL mask centred on the field's bottom-left corner, not a diagonal\n   linear one. The linear version is the obvious reading of \"cut the\n   bottom-left\" and it is wrong: a 215deg gradient runs the whole length of\n   the diagonal, so it dims the bottom-RIGHT to about half alpha as well\n   and the light stops reaching down the right edge. A radial centred on\n   the corner takes out only the corner. */\n.band-field.lit-corner {\n  -webkit-mask-image: radial-gradient(100% 138% at -6% 104%,\n    transparent 0%, rgba(0,0,0,0.18) 34%, rgba(0,0,0,0.62) 58%, #000 84%);\n          mask-image: radial-gradient(100% 138% at -6% 104%,\n    transparent 0%, rgba(0,0,0,0.18) 34%, rgba(0,0,0,0.62) 58%, #000 84%);\n}\n\n/* THE LIGHT IS A BLOB, not the band ramp. Screened over the bands as one\n   wide oval, so brightness falls off in every direction from a centre\n   rather than only leftward.\n\n   This is the distinction that decides whether the field reads as light at\n   all. A monotonic left-to-right ramp across the bands can only ever be a\n   gradient: every row of the field is equally bright, so there is no\n   source, just a wash that happens to be brighter on one side. An oval has\n   a centre and a falloff, which is what a light actually looks like, and it\n   is why the bands underneath should stay comparatively FLAT and dark --\n   their job is the vertical structure the light falls across, not the\n   brightness itself.\n\n   mix-blend-mode: screen rather than an alpha overlay. Screen lightens\n   without flattening what is beneath it, so every band edge survives\n   inside the blob; a translucent light-coloured overlay washes those steps\n   out and takes the bars with them.\n\n   Size it so the oval reaches the top edge and dies just past the bottom\n   of the card stack. Pulling the vertical falloff in tighter than that\n   looks right in the abstract and leaves the LAST card sitting on\n   near-black while the others are lit, which reads as a mistake rather\n   than as falloff. The lower edge of the oval and the bottom-left mask\n   are two halves of one shape; let the mask do the cutting.\n\n   Keep the first two stops OPAQUE. A blob whose alpha starts dropping at\n   a third of the radius lights a small spot and nothing else, and since\n   the cards cover most of the field, a small spot is invisible: all of it\n   ends up behind a dark-tinted panel. The oval has to be genuinely large\n   and genuinely bright, because what the slide shows of it is only the\n   gaps between the cards, the margin beside them, and whatever the cards\n   themselves let through. */\n.band-field .field-blob {\n  position: absolute; inset: 0; pointer-events: none;\n  mix-blend-mode: screen;\n  background: radial-gradient(68% 52% at 58% 42%,\n    rgb(160, 180, 126) 0%,\n    rgb(130, 148, 104) 38%,\n    rgba(92, 106, 76, 0.46) 66%,\n    transparent 88%);\n}\n\n/* Bands that reach PAST the midline, showing only in the top strip.\n   Once .field-blob carries the light, the field is free to run further\n   left than the band ramp alone could justify: the extra bands sit near\n   the slide background and the blob barely reaches them, so they read as\n   the faint outer edge of the light rather than as a second bright half\n   competing with the dark column. Give each its own downward fade and\n   STAGGER the four, soonest on the left, so the group has a shape instead\n   of a hard bottom edge.\n\n   Watch the RAMP FLOOR when you add them. Extending the eased ramp\n   downward to make the new bands \"dimmer\" walks them to the slide\n   background, where there is nothing left to fade and the four bars simply\n   do not exist -- the markup and the mask both look right. The floor has to\n   stay a visible step above the ground at the top of the slide, where\n   --dark-bg-2 measures about 25; a floor near 34 reads as a faint bar,\n   anything under about 28 reads as nothing.\n\n   This fade is the one thing that lets the field cross centre. Un-faded\n   bands past the midline put structure into the left column and the\n   composition collapses into one busy slide. */\n.band-field .band.top-only {\n  -webkit-mask-image: linear-gradient(180deg,\n    #000 0%, rgba(0,0,0,0.5) calc(var(--tf, 34%) * 0.45), transparent var(--tf, 34%));\n          mask-image: linear-gradient(180deg,\n    #000 0%, rgba(0,0,0,0.5) calc(var(--tf, 34%) * 0.45), transparent var(--tf, 34%));\n}\n\n/* The blue light. Deliberately NOT built from --orb-blue-*: those are deep\n   by design, for a filled disc, and a blue at that value cannot read as a\n   light source. Note also that blue cannot reach the green's luminance at\n   any saturation -- pure blue is luminance 29 -- so a blue blob is\n   necessarily paler and less saturated than the green one at matching\n   brightness. Do not try to correct that by saturating it; it goes purple\n   and stops looking like light. */\n.field-blob.blue {\n  background: radial-gradient(68% 52% at 58% 42%,\n    rgb(123, 160, 220) 0%,\n    rgb(96, 128, 186) 38%,\n    rgba(64, 88, 132, 0.46) 66%,\n    transparent 88%);\n}\n\n/* Corner framing that lands on the lit strip has to flip to DARK ink, and\n   this is easy to ship broken because it looks fine in the markup. A\n   .frame-tag is white at 0.55 opacity, and on a band measuring luminance\n   190 that is invisible -- the tag and the page number simply are not\n   there in the render. Measure the ground under every framing element on a\n   slide with a lit edge rather than trusting the layout. */\n.frame-tag.on-lit { color: rgba(14,20,12,0.80); opacity: 1; }\n\n/* 3-5 equal glass cards dividing a fixed height. flex:1 is what lets the\n   count vary without recomputing anything -- give the stack its box and\n   the cards share it. */\n.card-stack { position: absolute; display: flex; flex-direction: column; gap: 26px; z-index: 2; }\n.card-stack > .glass-panel {\n  flex: 1; position: relative;\n  display: flex; flex-direction: column; justify-content: center;\n  /* The dark tint. Alpha runs DOWN the card so it stays lit at the bottom\n     like every other surface here. At ~0.48 average it halves the field's\n     luminance under the copy while leaving the card visibly tinted by it. */\n  background: linear-gradient(180deg, rgba(9,11,15,0.60), rgba(9,11,15,0.36));\n}\n\n/* The stack divides one fixed height, so the card count sets the card\n   height. Worked through at 1139px of stack with 26px gaps, against a\n   40px title (48px line) plus an 18px gap plus a two-line 28px body\n   (84px) = 150px of content, inside 40px padding:\n\n     3 cards -> 362px each, 282px of content box. Generous; the copy\n                centres with real slack above and below, which is how the\n                reference looks and is not a bug.\n     4 cards -> 265px each, 185px of content box. Snug. The default.\n     5 cards -> 207px each, 127px of content box, which is 23px SHORT of\n                a two-line body. Five cards needs a one-line body, or\n                tighter padding than this file sets. Not wired up here;\n                check the render before shipping five.\n\n   Note what does NOT change with the count: body length. At 28px in an\n   860px measure a card body runs about 61 characters per line, so the\n   25-word ceiling in copy-discipline.md is two lines whatever the count.\n   More cards buys more points, never more room per point. */\n/* The index sits TOP-RIGHT here, not top-left as in the quad grid: the\n   card is a wide band rather than a square, so a number in the far corner\n   reads as a marker on the band instead of a label above the title. */\n.stack-nu
