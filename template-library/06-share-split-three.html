<link rel="stylesheet" href="deck-system.css">
<style>
  /* Share split, three shares, dark.

     Same proportions as the two-share version. The second share takes the
     MIDDLE number slot and --teal-*, which is the documented job of the
     second hue: three values of one blue are far harder to separate at a
     glance than blue / teal / grey.

     The centre number is centred on the CANVAS, not over its own run of
     circles (which for 54/31/15 would sit at about 70% across). Three
     numbers reading left / centre / right is worth more than that
     alignment, and it does not move when the data does. */
  .num-left   { position: absolute; top: 312px; left: 160px;  z-index: 2; }
  .num-mid    { position: absolute; top: 312px; left: 0; right: 0; text-align: center; z-index: 2; }
  .num-right  { position: absolute; top: 312px; right: 160px; text-align: right; z-index: 2; }
  .note-left  { position: absolute; top: 574px; left: 160px;  width: 660px; z-index: 2; }
  .note-mid   { position: absolute; top: 574px; left: 950px;  width: 660px; text-align: center; z-index: 2; }
  .note-right { position: absolute; top: 574px; right: 160px; width: 660px; text-align: right; z-index: 2; }
</style>
</head>

    <div class="note-left">
      <div class="share-note" data-overlay="s6-n1">
        A lookup against a single table<br>comes back in under a second.
      </div>
    </div>

    <div class="num-mid"><div class="share-num second" data-overlay="s6-v2">31%</div></div>
    <div class="note-mid">
      <div class="share-note" data-overlay="s6-n2">
        A join across two or three tables<br>costs about four seconds.
