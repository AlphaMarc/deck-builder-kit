<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="deck-system.css">
<style>
  /* Same composition and same diagram, dark. This is the version to use
     when the slide is the turn in the story rather than the setup: on
     black the lit grid is the only bright object on the canvas, so the
     ordered side does more of the arguing. */
  .glow-order { left: 1310px; top: 108px; width: 1120px; height: 1120px; opacity: 0.72; }
</style>
</head>
<body>
  <div class="slide dark">
    <div class="glow accent glow-order"></div>

    <div class="frame-logo" data-overlay="s2-logo">Nexthink</div>
    <div class="frame-tag" data-overlay="s2-tag">Statement frame · dark</div>

    <div class="corner-note">
      <div class="subtitle dark" data-overlay="s2-note">
        One extraction pass turns every file into the same set of fields,
        whatever the file started as.
      </div>
    </div>

    <div class="scatter-field" style="left:340px; top:420px; width:623px; height:497px;">
      <div class="dot chaos on-dark" style="left:19px;  top:100px;"></div>
      <div class="dot chaos on-dark" style="left:199px; top:18px;"></div>
      <div class="dot chaos on-dark" style="left:300px; top:125px;"></div>
      <div class="dot chaos on-dark" style="left:417px; top:102px;"></div>
      <div class="dot chaos on-dark" style="left:154px; top:225px;"></div>
      <div class="dot chaos on-dark" style="left:268px; top:259px;"></div>
      <div class="dot chaos on-dark" style="left:409px; top:287px;"></div>
      <div class="dot chaos on-dark" style="left:42px;  top:353px;"></div>
      <div class="dot chaos on-dark" style="left:201px; top:411px;"></div>
      <div class="dot chaos on-dark" style="left:537px; top:329px;"></div>
    </div>

    <svg class="flow-arrow on-dark" style="left:1090px; top:645px;" width="450" height="46" viewBox="0 0 450 46">
      <path d="M0 23 H 428"/>
      <path d="M414 10 L 436 23 L 414 36"/>
    </svg>

    <div class="order-grid" style="left:1690px; top:488px;">
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
      <div class="dot ordered"></div>
    </div>

    <div class="hero-statement">
      <div class="title xl" data-overlay="s2-claim">A contract and a chat thread<br>answer the same question.</div>
    </div>
  </div>
</body>
</html>
