<style>
  /* Share split, two shares, dark.

     Vertical values are the reference proportions (see the .share-split
     comment in deck-system.css). Only the three block tops are local:

       big number digit top  23.9% of 1440 = 345  ->  box top 312
       note cap top          40.6% of 1440 = 585  ->  box top 574
       field top             52.0% of 1440 = 748

     The field top is deliberately the SAME 52% line the stat rail starts
     its hairlines on, so a deck that uses both layouts has one shared
     horizon rather than two nearly-equal ones. */
  .num-left  { position: absolute; top: 312px; left: 160px;  z-index: 2; }
  .num-right { position: absolute; top: 312px; right: 160px; text-align: right; z-index: 2; }
  .note-left  { position: absolute; top: 574px; left: 160px;  width: 660px; z-index: 2; }
  .note-right { position: absolute; top: 574px; right: 160px; width: 660px; text-align: right; z-index: 2; }
</style>
</head>
